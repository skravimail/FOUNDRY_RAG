[project]
name = "foundry-rag"
version = "0.1.0"
description = "Python port of deployed-in-azure/RAG's 9 RAG-mechanism demos, running on Microsoft/Azure AI Foundry"
readme = "README.md"
authors = [
    { name = "alpha", email = "Alba@abc.com" }
]
requires-python = ">=3.11"
dependencies = [
    "azure-ai-evaluation>=1.18.1",
    "azure-ai-inference>=1.0.0b9",
    "azure-ai-projects>=2.3.0",
    "azure-identity>=1.25.3",
    "azure-search-documents>=12.0.0",
    "neo4j>=6.2.0",
    "openai>=2.45.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "tiktoken>=0.13.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
