services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: foundry-rag-pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: t2_ragbench
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d t2_ragbench"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgvector_data:
